# render.yaml — Render Blueprint for the backend
#
# Deliberately has NO `disk:` block. Generated files are written to a
# temp folder during processing and uploaded to Cloudinary immediately
# after (see src/lib/storage/uploadCloudinary.ts + PipelineRunner.ts),
# then deleted — so this backend does not need a persistent disk, and
# `plan: free` works fine. If you upgrade `plan` to a paid tier later for
# more CPU/RAM/uptime, you still don't need to add a disk back.
#
# This must be a Web Service, not a Background Worker — the backend
# receives inbound HTTP requests (POST /api/generate SSE stream, GET
# /api/library, etc.), so it needs a public HTTP endpoint.
#
# This backend shells out to `python` (via child_process.spawn) and
# expects ffmpeg + a Python 3 runtime with requirements.txt installed.
# Render's native Node runtime does NOT include Python/ffmpeg — this uses
# the Dockerfile in this repo instead, which bundles all three.

services:
  - type: web
    name: lifestyleflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: VISUAL_SOURCE
        value: pixel
      - key: VISUAL_PROVIDER
        value: pexels
      - key: AI_VIDEO_ENABLED
        value: "false"
      - key: PEXELS_FALLBACK
        value: "true"
      - key: MAX_AI_RETRIES
        value: "2"
      - key: VIDEO_DURATION_MODE
        value: scene
      - key: VIDEO_RESOLUTION
        value: 1280x720
      - key: VIDEO_FPS
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_VEO_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: PIKA_API_KEY
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: FAL_MODEL
        value: fal-ai/kling-video/v2.1/standard/text-to-video
      - key: FAL_EXTRA_PARAMS
        sync: false
      - key: FAL_TIMEOUT_SECONDS
        value: "300"
      - key: STABILITY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PAGE_ID
        sync: false
      - key: SHORT_LIVED_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ID
        sync: false
